name: Fotos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar las fotos que falten
        run: |
          set -e
          mkdir -p assets
          get() { [ -f "assets/$1" ] || curl -fsSL -A "AgroMatch/1.0 (https://juan080305.github.io/agromatch/)" -o "assets/$1" "$2"; }
          get cartago-farm.jpg "https://images.unsplash.com/photo-1612617743322-8cc3f12e0ab0?w=1600&q=78&fm=jpg&fit=max"
          get tomatoes.jpg "https://images.unsplash.com/photo-1594567170531-bb0a139aaba3?w=1000&q=78&fm=jpg&fit=max"
          get vegetables.jpg "https://images.unsplash.com/photo-1693736672305-104bd0843264?w=1000&q=78&fm=jpg&fit=max"
          get avocado.jpg "https://images.unsplash.com/photo-1519162808019-7de1683fa2ad?w=1000&q=78&fm=jpg&fit=max"
          get bananas.jpg "https://images.unsplash.com/photo-1675586677399-2dbd468cad2f?w=1000&q=78&fm=jpg&fit=max"
          get carrots.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Fresh_Carrots_(Unsplash).jpg?width=1280"
          ls -la assets
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Agrega las fotos del sitio"; git push; }
